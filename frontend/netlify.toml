# Netlify-Deploy für das EstimateIQ-Frontend (Vite/React SPA).
# Base auf "frontend" setzen, wenn das Repo-Root gewählt wird.

[build]
  command = "npm run build"
  publish = "dist"

# SPA-Fallback: alle Routen auf index.html (react-router übernimmt das Routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
